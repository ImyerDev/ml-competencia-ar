<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>ML Competencia AR</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Estilos propios del popup (el resto viene de styles.css) */
    html, body { margin: 0; }
    body {
      width: 420px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--mlc-text);
      background: var(--mlc-bg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--mlc-brand);
      color: var(--mlc-brand-text);
    }
    header h1 { margin: 0; font-size: 15px; font-weight: 700; }
    main { padding: 14px 16px 16px; }
    .product-title {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.35;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      color: var(--mlc-muted);
      font-size: 11px;
    }
    details { margin-top: 14px; border-top: 1px solid var(--mlc-border); padding-top: 10px; }
    summary { cursor: pointer; color: var(--mlc-muted); font-size: 12px; }
    .settings { display: grid; gap: 6px; margin-top: 8px; }
    .settings input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px 9px;
      border: 1px solid var(--mlc-border);
      border-radius: 6px;
      font: inherit;
      background: var(--mlc-surface);
      color: var(--mlc-text);
    }
    .settings p { margin: 0; color: var(--mlc-muted); font-size: 11px; line-height: 1.4; }
  </style>
</head>
<body>
  <header>
    <h1>📊 ML Competencia AR</h1>
    <button id="refresh" class="mlc-btn mlc-btn--ghost" type="button" title="Volver a analizar">↻</button>
  </header>

  <main>
    <div id="status" class="mlc-muted">Cargando…</div>

    <section id="result" hidden>
      <p id="product-title" class="product-title"></p>

      <div class="mlc-stats">
        <div class="mlc-stat">
          <span class="mlc-stat__label">Precio actual</span>
          <strong id="current-price" class="mlc-stat__value">—</strong>
        </div>
        <div class="mlc-stat">
          <span class="mlc-stat__label">Promedio competencia</span>
          <strong id="avg-price" class="mlc-stat__value">—</strong>
        </div>
      </div>
      <div id="diff"></div>

      <table class="mlc-table">
        <thead>
          <tr>
            <th>Competidor</th>
            <th class="num">Precio</th>
            <th>Envío</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="competitors"></tbody>
      </table>

      <div class="footer">
        <span id="source"></span>
        <span id="query"></span>
      </div>
    </section>

    <details>
      <summary>Configuración (opcional)</summary>
      <form id="settings" class="settings">
        <label for="token">Access token de MercadoLibre</label>
        <input id="token" type="password" placeholder="APP_USR-..." autocomplete="off" />
        <p>
          Si la API pública rechaza la búsqueda sin autenticación, la extensión
          lee el listado web. Con un token propio usa la API (más estable).
          Se guarda solo en este navegador.
        </p>
        <button class="mlc-btn" type="submit">Guardar</button>
      </form>
    </details>
  </main>

  <script src="popup.js"></script>
</body>
</html>
